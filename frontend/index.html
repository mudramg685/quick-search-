<!doctype html>
<html lang="en" data-accent="vermilion" data-font="serif" data-size="m">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuirkSearch — an independent search engine with its own crawler, index and ranking. Curiosity deserves better results." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <title>QuirkSearch</title>
    <script>
      // Apply saved preferences before first paint (no flash of the wrong theme or accent).
      (function () {
        var el = document.documentElement, s = {};
        try { s = JSON.parse(localStorage.getItem("qs-settings") || "{}") || {}; } catch (e) {}
        var theme = s.theme || "system";
        var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) el.classList.add("dark");
        if (s.accent) el.setAttribute("data-accent", s.accent);
        if (s.font) el.setAttribute("data-font", s.font);
        if (s.size) el.setAttribute("data-size", s.size);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
